
name: Build Tugas 6 EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C++
        run: g++ tugas_6.cpp -o tugas_6.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: tugas-6-exe
          path: tugas_6.exe
